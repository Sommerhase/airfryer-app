<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airfryer Magazin & Rezepte</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-12">
    <header class="bg-gradient-to-r from-amber-600 to-orange-500 text-white p-4 shadow-md">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">Airfryer Magazin & Rezepte</h1>
                <p class="text-xs text-amber-100">Mit Datei-Sync & Bildern</p>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleModal('modal-neu')" class="bg-white text-amber-700 font-semibold px-3 py-1.5 rounded-lg shadow text-sm hover:bg-amber-50">+ Neu</button>
                <button onclick="toggleModal('modal-sync')" class="bg-amber-700 text-white px-3 py-1.5 rounded-lg shadow text-sm hover:bg-amber-800 border border-amber-500">Sync</button>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4">
        <!-- Suchleiste -->
        <div class="mb-4">
            <input type="text" id="searchInput" oninput="filterRecipes()" placeholder="Suche nach Rezept, Zutat oder Magazin..." class="w-full p-3 rounded-xl border border-gray-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
        </div>

        <!-- Kategorien -->
        <div class="flex gap-2 overflow-x-auto pb-2 mb-4 scrollbar-none">
            <button onclick="setCategory('Alle')" class="cat-btn bg-amber-600 text-white px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap shadow-sm">Alle</button>
            <button onclick="setCategory('Cover')" class="cat-btn bg-white text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap border border-gray-200">📖 Cover</button>
            <button onclick="setCategory('Hauptgericht')" class="cat-btn bg-white text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap border border-gray-200">Hauptgericht</button>
            <button onclick="setCategory('Snacks')" class="cat-btn bg-white text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap border border-gray-200">Snacks</button>
            <button onclick="setCategory('Süßes')" class="cat-btn bg-white text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap border border-gray-200">Süßes</button>
        </div>

        <div id="recipeCount" class="text-xs text-gray-500 mb-3">0 Einträge gefunden</div>

        <!-- Rezept-Liste -->
        <div id="recipeList" class="space-y-3"></div>
    </main>

    <!-- MODAL: NEUES REZEPT -->
    <div id="modal-neu" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full p-5 shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-bold text-gray-800">Rezept / Magazin hinzufügen</h2>
                <button onclick="toggleModal('modal-neu')" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>
            
            <p class="text-xs text-gray-500 mb-2">Füge hier den Text ein:</p>
            <textarea id="turboInput" rows="6" placeholder="Titel, Zutaten, Zubereitung..." class="w-full p-3 border rounded-xl text-sm font-mono focus:ring-2 focus:ring-amber-500 focus:outline-none mb-3"></textarea>

            <div class="mb-3">
                <label class="block text-xs font-semibold text-gray-600 mb-1">Foto vom Gerät auswählen:</label>
                <input type="file" id="imageFile" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100">
            </div>

            <div class="mb-3">
                <label class="block text-xs font-semibold text-gray-600 mb-1">Kategorie wählen:</label>
                <select id="turboCategory" class="w-full p-2 border rounded-xl text-sm bg-white">
                    <option value="Hauptgericht">Hauptgericht</option>
                    <option value="Cover">📖 Cover (Magazin)</option>
                    <option value="Snacks">Snacks</option>
                    <option value="Süßes">Süßes</option>
                </select>
            </div>

            <div class="flex justify-end gap-2">
                <button onclick="toggleModal('modal-neu')" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-xl">Abbrechen</button>
                <button onclick="saveTurboRecipe()" class="px-4 py-2 text-sm bg-amber-600 text-white font-semibold rounded-xl hover:bg-amber-700 shadow">Speichern</button>
            </div>
        </div>
    </div>

    <!-- MODAL: REZEPT DETAIL-ANSICHT -->
    <div id="modal-detail" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
            <div id="detailContent"></div>
            <div class="flex justify-end mt-5">
                <button onclick="toggleModal('modal-detail')" class="px-4 py-2 text-sm bg-amber-600 text-white font-semibold rounded-xl">Schließen</button>
            </div>
        </div>
    </div>

    <!-- MODAL: SYNC / DATEI EXPORT & IMPORT -->
    <div id="modal-sync" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full p-5 shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-bold text-gray-800">Geräte-Synchronisation</h2>
                <button onclick="toggleModal('modal-sync')" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>
            
            <p class="text-xs text-gray-600 mb-3">Lade hier deine exportierte Rezept-Datei vom Handy hoch, um sie auf das Tablet zu übertragen.</p>

            <div class="mb-4 bg-gray-50 p-3 rounded-xl border">
                <label class="block text-xs font-semibold text-gray-700 mb-1">1. Rezepte-Datei vom Handy exportieren:</label>
                <button onclick="exportJSONFile()" class="w-full py-2 bg-white hover:bg-gray-100 text-gray-800 rounded-xl text-sm font-medium border shadow-sm">Backup-Datei herunterladen (.json)</button>
            </div>

            <div class="mb-3 bg-amber-50/50 p-3 rounded-xl border border-amber-200">
                <label class="block text-xs font-semibold text-amber-900 mb-1">2. Rezepte-Datei auf dem Tablet importieren:</label>
                <input type="file" id="importFile" accept=".json" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-600 file:text-white hover:file:bg-amber-700 mb-2">
                <button onclick="importJSONFile()" class="w-full py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-sm font-medium shadow">Datei einlesen & Rezepte speichern</button>
            </div>

            <div class="flex justify-end mt-4">
                <button onclick="toggleModal('modal-sync')" class="px-4 py-2 text-sm bg-gray-200 text-gray-700 rounded-xl">Schließen</button>
            </div>
        </div>
    </div>

    <script>
        let db;
        let currentCategory = 'Alle';
        let recipes = [];

        const request = indexedDB.open('AirfryerMagazinDB', 1);
        request.onerror = () => alert('Fehler beim Öffnen der Datenbank');
        request.onsuccess = (e) => {
            db = e.target.result;
            loadRecipes();
        };
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains('recipes')) {
                db.createObjectStore('recipes', { keyPath: 'id', autoIncrement: true });
            }
        };

        function toggleModal(id) {
            const modal = document.getElementById(id);
            modal.classList.toggle('hidden');
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if(btn.textContent.includes(cat) || (cat === 'Alle' && btn.textContent === 'Alle')) {
                    btn.className = "cat-btn bg-amber-600 text-white px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap shadow-sm";
                } else {
                    btn.className = "cat-btn bg-white text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap border border-gray-200";
                }
            });
            renderRecipes();
        }

        function saveTurboRecipe() {
            const text = document.getElementById('turboInput').value.trim();
            const category = document.getElementById('turboCategory').value;
            const fileInput = document.getElementById('imageFile');
            if(!text) { alert('Bitte Text eingeben'); return; }

            const lines = text.split('\n');
            const title = lines[0] || 'Unbenanntes Rezept';
            const details = lines.slice(1).join('\n');

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    storeRecipeInDB(title, details, category, e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                storeRecipeInDB(title, details, category, '');
            }
        }

        function storeRecipeInDB(title, details, category, imageData) {
            const transaction = db.transaction(['recipes'], 'readwrite');
            const store = transaction.objectStore('recipes');
            store.add({ title, details, category, image: imageData, date: new Date().toLocaleDateString() });

            transaction.oncomplete = () => {
                document.getElementById('turboInput').value = '';
                document.getElementById('imageFile').value = '';
                toggleModal('modal-neu');
                loadRecipes();
            };
        }

        function loadRecipes() {
            const transaction = db.transaction(['recipes'], 'readonly');
            const store = transaction.objectStore('recipes');
            const request = store.getAll();
            request.onsuccess = () => {
                recipes = request.result;
                renderRecipes();
            };
        }

        function renderRecipes() {
            const list = document.getElementById('recipeList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = recipes.filter(r => {
                const matchCat = currentCategory === 'Alle' || r.category === currentCategory;
                const matchSearch = r.title.toLowerCase().includes(search) || (r.details && r.details.toLowerCase().includes(search));
                return matchCat && matchSearch;
            });

            document.getElementById('recipeCount').innerText = `${filtered.length} Einträge gefunden`;

            if(filtered.length === 0) {
                list.innerHTML = `<div class="text-center py-8 text-gray-400 text-sm">Keine Einträge gefunden.</div>`;
                return;
            }

            list.innerHTML = filtered.map(r => `
                <div onclick="openDetail(${r.id})" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex gap-3 items-start cursor-pointer hover:border-amber-300 transition">
                    ${r.image ? `<img src="${r.image}" class="w-16 h-16 object-cover rounded-xl flex-shrink-0 border">` : ''}
                    <div class="flex-grow">
                        <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-amber-50 text-amber-700">${r.category}</span>
                        <h3 class="font-bold text-gray-800 text-base mt-1">${escapeHtml(r.title)}</h3>
                        <p class="text-xs text-gray-600 mt-1 whitespace-pre-line line-clamp-2">${escapeHtml(r.details || '')}</p>
                    </div>
                    <button onclick="event.stopPropagation(); deleteRecipe(${r.id})" class="text-red-400 hover:text-red-600 p-2 text-sm flex-shrink-0">🗑️</button>
                </div>
            `).join('');
        }

        function openDetail(id) {
            const r = recipes.find(item => item.id === id);
            if(!r) return;

            const content = `
                ${r.image ? `<img src="${r.image}" class="w-full h-48 object-cover rounded-2xl mb-4 border">` : ''}
                <span class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded bg-amber-50 text-amber-700">${r.category}</span>
                <h2 class="text-xl font-bold text-gray-900 mt-2 mb-3">${escapeHtml(r.title)}</h2>
                <div class="text-sm text-gray-700 whitespace-pre-line leading-relaxed">${escapeHtml(r.details || '')}</div>
            `;
            document.getElementById('detailContent').innerHTML = content;
            toggleModal('modal-detail');
        }

        function deleteRecipe(id) {
            if(confirm('Eintrag wirklich löschen?')) {
                const transaction = db.transaction(['recipes'], 'readwrite');
                transaction.objectStore('recipes').delete(id);
                transaction.oncomplete = loadRecipes;
            }
        }

        function filterRecipes() { renderRecipes(); }

        function exportJSONFile() {
            const transaction = db.transaction(['recipes'], 'readonly');
            const store = transaction.objectStore('recipes');
            store.getAll().onsuccess = (e) => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(e.target.result));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", "airfryer_rezepte_backup.json");
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };
        }

        function importJSONFile() {
            const fileInput = document.getElementById('importFile');
            if(!fileInput.files || !fileInput.files[0]) { alert('Bitte wähle zuerst eine Datei aus.'); return; }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    const transaction = db.transaction(['recipes'], 'readwrite');
                    const store = transaction.objectStore('recipes');
                    imported.forEach(r => {
                        delete r.id; 
                        store.add(r);
                    });
                    transaction.oncomplete = () => {
                        alert('Erfolgreich importiert!');
                        toggleModal('modal-sync');
                        loadRecipes();
                    };
                } catch(err) {
                    alert('Fehler beim Lesen der Datei!');
                }
            };
            reader.readAsText(fileInput.files[0]);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
