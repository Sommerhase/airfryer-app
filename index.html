<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Airfryer Magazin & Rezept-Manager Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js -->
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.worker.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-gradient-to-r from-orange-600 to-amber-500 text-white shadow-md sticky top-0 z-30 px-4 py-3">
        <div class="flex justify-between items-center mb-2">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-book-open-reader text-2xl"></i>
                <div>
                    <h1 class="font-bold text-base tracking-tight leading-tight">Airfryer Magazin & Rezepte</h1>
                    <p class="text-[10px] text-orange-100">Mit direktem Turbo-Einfügefeld</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="openModal()" class="bg-white text-orange-600 font-bold px-3 py-1.5 rounded-xl shadow text-xs flex items-center gap-1.5 active:scale-95 transition">
                    <i class="fa-solid fa-plus"></i> Neu
                </button>
                <button onclick="exportBackup()" title="Backup" class="bg-orange-700 text-white px-2.5 py-1.5 rounded-xl shadow text-xs">
                    <i class="fa-solid fa-download"></i>
                </button>
            </div>
        </div>
        <div class="relative">
            <input type="text" id="searchInput" oninput="renderRecipes()" placeholder="Suche nach Rezept, Zutat oder Magazin..." 
                class="w-full pl-9 pr-4 py-2 rounded-xl text-slate-800 bg-white/95 focus:bg-white focus:outline-none text-xs shadow-inner">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
        </div>
    </header>

    <!-- Hauptbereich -->
    <main class="max-w-md mx-auto px-3 py-4 flex-1 w-full pb-20">
        <div class="flex gap-2 overflow-x-auto pb-2 mb-3 scrollbar-none" id="categoryFilters">
            <button onclick="setFilter('Alle')" class="filter-btn shrink-0 bg-orange-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm">Alle</button>
            <button onclick="setFilter('Magazin-Cover')" class="filter-btn shrink-0 bg-white text-slate-600 px-3 py-1.5 rounded-lg text-xs font-semibold border">📚 Cover</button>
            <button onclick="setFilter('Hauptgericht')" class="filter-btn shrink-0 bg-white text-slate-600 px-3 py-1.5 rounded-lg text-xs font-semibold border">Hauptgericht</button>
            <button onclick="setFilter('Snack & Beilage')" class="filter-btn shrink-0 bg-white text-slate-600 px-3 py-1.5 rounded-lg text-xs font-semibold border">Snacks</button>
            <button onclick="setFilter('Backen & Süßes')" class="filter-btn shrink-0 bg-white text-slate-600 px-3 py-1.5 rounded-lg text-xs font-semibold border">Süßes</button>
        </div>

        <div id="recipeCount" class="text-xs text-slate-500 font-medium mb-3 px-1">0 Einträge gefunden</div>
        <div id="recipeGrid" class="space-y-3"></div>
    </main>

    <!-- Modal -->
    <div id="recipeModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white rounded-t-3xl sm:rounded-2xl max-w-lg w-full p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h2 class="font-bold text-slate-800 flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-wand-magic-sparkles text-orange-500"></i> Rezept erfassen
                </h2>
                <button onclick="closeModal()" class="text-slate-400 text-lg px-2"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Turbo-Import Box mit direktem Einfüge-Feld -->
            <div class="bg-amber-50 border-2 border-dashed border-amber-300 rounded-xl p-3 mb-4">
                <label class="block text-[11px] font-bold uppercase text-amber-900 mb-1">⚡ Turbo-Import aus Gemini-Chat:</label>
                <textarea id="turboInput" rows="3" oninput="processTurboInput()" placeholder="Füge den Text aus dem Chat hier per Langtippen ein..." class="w-full border border-amber-300 rounded-lg p-2 text-xs bg-white text-slate-800 outline-none focus:ring-2 focus:ring-orange-500 font-mono"></textarea>
                <p class="text-[10px] text-amber-700 mt-1">Füllt Titel, Kategorie, Temp, Zeit & Rezept unten sofort automatisch aus!</p>

                <div class="border-t border-amber-200 mt-2 pt-2 grid grid-cols-2 gap-1.5">
                    <button type="button" onclick="document.getElementById('galleryInput').click()" class="bg-white text-amber-900 border border-amber-300 font-semibold py-1.5 px-2 rounded-lg text-[11px] flex items-center justify-center gap-1">
                        <i class="fa-solid fa-image text-orange-600"></i> Foto / Galerie
                    </button>
                    <input type="file" id="galleryInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">

                    <button type="button" onclick="document.getElementById('pdfInput').click()" class="bg-white text-amber-900 border border-amber-300 font-semibold py-1.5 px-2 rounded-lg text-[11px] flex items-center justify-center gap-1">
                        <i class="fa-solid fa-file-pdf text-red-500"></i> PDF wählen
                    </button>
                    <input type="file" id="pdfInput" accept=".pdf,application/pdf" class="hidden" onchange="handlePdfUpload(event)">
                </div>
            </div>

            <form id="recipeForm" onsubmit="saveRecipe(event)" class="space-y-3">
                <input type="hidden" id="recipeId">
                
                <div>
                    <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Titel / Name *</label>
                    <input type="text" id="title" required placeholder="z. B. Lachs mit Gemüse" class="w-full border rounded-lg px-3 py-2 text-xs outline-none">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Typ / Kategorie</label>
                        <select id="category" class="w-full border rounded-lg px-2 py-2 text-xs bg-white outline-none" onchange="toggleCategoryFields()">
                            <option value="Hauptgericht">Hauptgericht (Rezept)</option>
                            <option value="Snack & Beilage">Snack / Beilage</option>
                            <option value="Backen & Süßes">Backen & Süßes</option>
                            <option value="Magazin-Cover">📚 Magazin-Cover (Titelblatt)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Heft-Zuordnung (Quelle)</label>
                        <input type="text" id="source" placeholder="z. B. Airfryer Club 02/26" class="w-full border rounded-lg px-3 py-2 text-xs outline-none">
                    </div>
                </div>

                <div id="paramFieldsContainer" class="grid grid-cols-2 gap-2 bg-slate-50 p-2.5 rounded-xl border">
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">🌡️ Temp. (°C)</label>
                        <input type="text" id="temp" placeholder="180" class="w-full border rounded-lg px-2 py-1 text-xs outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">⏱️ Zeit (Min.)</label>
                        <input type="text" id="time" placeholder="20" class="w-full border rounded-lg px-2 py-1 text-xs outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Erkannter Text & Rezept *</label>
                    <textarea id="content" rows="5" required placeholder="Hier landet der formatierte Text..." class="w-full border rounded-lg p-2.5 text-xs font-mono outline-none"></textarea>
                </div>

                <div class="flex items-center justify-between border rounded-xl p-2.5 bg-slate-50">
                    <span class="text-xs text-slate-600 font-medium">Foto hinterlegt</span>
                    <div id="imagePreviewContainer" class="hidden relative w-12 h-12">
                        <img id="imagePreview" src="" class="w-full h-full object-cover rounded-lg border">
                        <button type="button" onclick="clearImage()" class="absolute -top-1 -right-1 bg-red-500 text-white rounded-full w-4 h-4 text-[9px]"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="w-1/2 py-2 rounded-xl border text-slate-600 text-xs font-semibold">Abbrechen</button>
                    <button type="submit" class="w-1/2 bg-orange-600 text-white font-semibold py-2 rounded-xl shadow text-xs">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Detail Ansicht -->
    <div id="viewModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-3">
        <div class="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl max-h-[90vh] flex flex-col">
            <div id="viewImageHeader" class="h-48 bg-slate-900 relative hidden">
                <img id="viewImage" src="" class="w-full h-full object-contain">
            </div>
            <div class="p-4 overflow-y-auto flex-1">
                <div class="flex justify-between items-start gap-2 mb-2">
                    <div>
                        <span id="viewCategory" class="text-[10px] font-bold uppercase bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full"></span>
                        <h2 id="viewTitle" class="font-bold text-base text-slate-800 mt-1"></h2>
                        <p id="viewSource" class="text-[11px] text-slate-400"></p>
                    </div>
                    <button onclick="closeViewModal()" class="text-slate-400 text-lg px-2"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <div id="viewParamsBox" class="flex gap-3 my-3 bg-orange-50 p-2.5 rounded-xl border border-orange-100">
                    <div class="flex items-center gap-1.5 text-xs font-bold text-orange-800">
                        <i class="fa-solid fa-temperature-high text-orange-500"></i> <span id="viewTemp">-- °C</span>
                    </div>
                    <div class="flex items-center gap-1.5 text-xs font-bold text-orange-800">
                        <i class="fa-regular fa-clock text-orange-500"></i> <span id="viewTime">-- Min.</span>
                    </div>
                </div>

                <div id="viewContent" class="whitespace-pre-line text-slate-700 text-xs leading-relaxed bg-slate-50 p-3 rounded-xl border font-mono"></div>
            </div>
        </div>
    </div>

    <script>
        let recipes = [];
        let currentFilter = 'Alle';
        let currentImageBase64 = '';

        const defaultRecipes = [
            {
                id: 'magazin-1',
                title: 'Airfryer Club 02/2026 (Titelblatt)',
                category: 'Magazin-Cover',
                temp: '',
                time: '',
                source: 'Airfryer Club 02/2026',
                content: 'Übersichtsheft mit Rezepten.',
                image: ''
            }
        ];

        window.addEventListener('DOMContentLoaded', loadFromStorage);

        async function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open('AirfryerMagazinDBPRO_V8', 1);
                req.onupgradeneeded = e => e.target.result.createObjectStore('store');
                req.onsuccess = e => resolve(e.target.result);
                req.onerror = e => reject(e);
            });
        }

        async function loadFromStorage() {
            try {
                const db = await openDB();
                const tx = db.transaction('store', 'readonly');
                const req = tx.objectStore('store').get('recipes');
                req.onsuccess = () => {
                    recipes = req.result || defaultRecipes;
                    renderRecipes();
                };
            } catch (e) {
                recipes = defaultRecipes;
                renderRecipes();
            }
        }

        async function saveToStorage() {
            try {
                const db = await openDB();
                const tx = db.transaction('store', 'readwrite');
                tx.objectStore('store').put(recipes, 'recipes');
            } catch (e) { console.error(e); }
        }

        function setFilter(cat) {
            currentFilter = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = btn.textContent.includes(cat) || (cat === 'Alle' && btn.textContent === 'Alle')
                    ? 'filter-btn shrink-0 bg-orange-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm'
                    : 'filter-btn shrink-0 bg-white text-slate-600 px-3 py-1.5 rounded-lg text-xs font-semibold border';
            });
            renderRecipes();
        }

        function toggleCategoryFields() {
            const cat = document.getElementById('category').value;
            const paramContainer = document.getElementById('paramFieldsContainer');
            if (cat === 'Magazin-Cover') {
                paramContainer.classList.add('hidden');
            } else {
                paramContainer.classList.remove('hidden');
            }
        }

        function renderRecipes() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const grid = document.getElementById('recipeGrid');
            grid.innerHTML = '';

            const filtered = recipes.filter(r => {
                const matchesCat = currentFilter === 'Alle' || r.category === currentFilter;
                const matchesSearch = !query || r.title.toLowerCase().includes(query) || r.content.toLowerCase().includes(query) || (r.source && r.source.toLowerCase().includes(query));
                return matchesCat && matchesSearch;
            });

            document.getElementById('recipeCount').textContent = `${filtered.length} Eintrag${filtered.length === 1 ? '' : 'e'} gefunden`;

            filtered.forEach(r => {
                const isCover = r.category === 'Magazin-Cover';
                const icon = isCover ? 'fa-book' : 'fa-utensils';
                const badgeColor = isCover ? 'bg-purple-100 text-purple-700' : 'bg-orange-100 text-orange-700';

                const imgHtml = r.image 
                    ? `<img src="${r.image}" class="w-16 h-16 object-cover rounded-xl shrink-0">`
                    : `<div class="w-16 h-16 bg-orange-100 rounded-xl shrink-0 flex items-center justify-center text-orange-400"><i class="fa-solid ${icon}"></i></div>`;

                const card = document.createElement('div');
                card.className = `bg-white rounded-2xl p-3 shadow-sm border ${isCover ? 'border-purple-300 bg-purple-50/40' : 'border-slate-200'} flex gap-3 items-center`;
                card.innerHTML = `
                    <div onclick="viewRecipe('${r.id}')" class="flex items-center gap-3 flex-1 min-w-0 cursor-pointer">
                        ${imgHtml}
                        <div class="min-w-0 flex-1">
                            <span class="text-[10px] font-bold uppercase ${badgeColor} px-2 py-0.5 rounded-full">${r.category}</span>
                            <h3 class="font-bold text-xs text-slate-800 truncate mt-1">${r.title}</h3>
                            <p class="text-[10px] text-slate-400 truncate">${r.source ? 'Heft: ' + r.source : ''}</p>
                        </div>
                    </div>
                    <div class="flex flex-col gap-1">
                        <button onclick="editRecipe('${r.id}')" class="text-blue-600 p-1 text-xs"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteRecipe('${r.id}')" class="text-red-500 p-1 text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- AUTOMATISCHER TURBO-IMPORT BEIM EINFÜGEN IN DAS TEXTFELD ---
        function processTurboInput() {
            const text = document.getElementById('turboInput').value;
            if (!text.trim()) return;

            document.getElementById('content').value = text;

            const lines = text.split('\n').filter(l => l.trim().length > 0);
            if (lines.length > 0) {
                let possibleTitle = lines[0].replace(/[^a-zA-ZäöüßÄÖÜ\s]/g, '').trim();
                if (possibleTitle.length > 3 && possibleTitle.length < 50) {
                    document.getElementById('title').value = possibleTitle;
                } else if (lines.length > 1) {
                    document.getElementById('title').value = lines[1].substring(0, 45);
                }
            }

            if (text.toLowerCase().includes('backen') || text.toLowerCase().includes('kuchen') || text.toLowerCase().includes('tarte')) {
                document.getElementById('category').value = 'Backen & Süßes';
            } else if (text.toLowerCase().includes('snack') || text.toLowerCase().includes('beilage')) {
                document.getElementById('category').value = 'Snack & Beilage';
            } else {
                document.getElementById('category').value = 'Hauptgericht';
            }

            const temps = [...text.matchAll(/(\d{2,3})\s*(?:°\s*C|Grad)/gi)];
            const times = [...text.matchAll(/(\d{1,3})\s*(?:Minuten|MIN\.?|Min\.?)/gi)];

            if (temps.length > 0) {
                document.getElementById('temp').value = temps[temps.length - 1][1];
            }
            if (times.length > 0) {
                const timeValues = times.map(m => parseInt(m[1], 10));
                document.getElementById('time').value = Math.max(...timeValues);
            }

            toggleCategoryFields();
        }

        async function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            compressImage(file, base64 => setPreviewImage(base64));
            e.target.value = '';
        }

        async function handlePdfUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer), disableWorker: true }).promise;
                const page = await pdf.getPage(1);
                const viewport = page.getViewport({ scale: 1.3 });
                const canvas = document.createElement('canvas');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                setPreviewImage(canvas.toDataURL('image/jpeg', 0.85));
                document.getElementById('title').value = file.name.replace(/\.pdf\$/i, '');
            } catch (err) { alert('PDF-Fehler'); }
            e.target.value = '';
        }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const max = 1000;
                    let w = img.width, h = img.height;
                    if (w > h && w > max) { h *= max / w; w = max; }
                    else if (h > max) { w *= max / h; h = max; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    callback(canvas.toDataURL('image/jpeg', 0.85));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function setPreviewImage(base64) {
            currentImageBase64 = base64;
            document.getElementById('imagePreview').src = base64;
            document.getElementById('imagePreviewContainer').classList.remove('hidden');
        }

        function clearImage() {
            currentImageBase64 = '';
            document.getElementById('imagePreview').src = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
        }

        async function saveRecipe(e) {
            e.preventDefault();
            const id = document.getElementById('recipeId').value || 'rec-' + Date.now();
            const r = {
                id,
                title: document.getElementById('title').value.trim(),
                category: document.getElementById('category').value,
                temp: document.getElementById('temp').value,
                time: document.getElementById('time').value,
                source: document.getElementById('source').value.trim(),
                content: document.getElementById('content').value.trim(),
                image: currentImageBase64
            };
            const idx = recipes.findIndex(x => x.id === id);
            if (idx >= 0) recipes[idx] = r; else recipes.unshift(r);
            await saveToStorage();
            renderRecipes();
            closeModal();
        }

        function openModal() {
            document.getElementById('recipeForm').reset();
            document.getElementById('recipeId').value = '';
            document.getElementById('turboInput').value = '';
            clearImage();
            toggleCategoryFields();
            document.getElementById('recipeModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('recipeModal').classList.add('hidden'); }

        function editRecipe(id) {
            const r = recipes.find(x => x.id === id);
            if (!r) return;
            openModal();
            document.getElementById('recipeId').value = r.id;
            document.getElementById('title').value = r.title;
            document.getElementById('category').value = r.category;
            document.getElementById('temp').value = r.temp || '';
            document.getElementById('time').value = r.time || '';
            document.getElementById('source').value = r.source || '';
            document.getElementById('content').value = r.content;
            toggleCategoryFields();
            if (r.image) setPreviewImage(r.image);
        }

        async function deleteRecipe(id) {
            if (confirm('Eintrag wirklich löschen?')) {
                recipes = recipes.filter(x => x.id !== id);
                await saveToStorage();
                renderRecipes();
            }
        }

        function viewRecipe(id) {
            const r = recipes.find(x => x.id === id);
            if (!r) return;
            document.getElementById('viewTitle').textContent = r.title;
            document.getElementById('viewCategory').textContent = r.category;
            document.getElementById('viewSource').textContent = r.source ? 'Heft / Quelle: ' + r.source : '';
            document.getElementById('viewContent').textContent = r.content;
            
            const paramsBox = document.getElementById('viewParamsBox');
            if (r.category === 'Magazin-Cover') {
                paramsBox.classList.add('hidden');
            } else {
                paramsBox.classList.remove('hidden');
                document.getElementById('viewTemp').textContent = r.temp ? r.temp + ' °C' : '--';
                document.getElementById('viewTime').textContent = r.time ? r.time + ' Min.' : '--';
            }

            const header = document.getElementById('viewImageHeader');
            if (r.image) {
                document.getElementById('viewImage').src = r.image;
                header.classList.remove('hidden');
            } else {
                header.classList.add('hidden');
            }
            document.getElementById('viewModal').classList.remove('hidden');
        }

        function closeViewModal() { document.getElementById('viewModal').classList.add('hidden'); }

        function exportBackup() {
            const blob = new Blob([JSON.stringify(recipes, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'airfryer_magazin_backup.json';
            a.click();
        }
    </script>
</body>
</html>
